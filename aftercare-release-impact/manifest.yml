modules:
  function:
    - key: aftercare-resolver
      handler: index.handler
    - key: gitlab-webhook-handler
      handler: index.gitlabWebhook
  webtrigger:
    - key: gitlab-webhook
      function: gitlab-webhook-handler
      urlFormat: v2
      response:
        type: static
        outputs:
          - key: accepted
            statusCode: 202
            contentType: application/json
            body: '{"accepted":true}'
          - key: unauthorized
            statusCode: 401
            contentType: application/json
            body: '{"error":"unauthorized"}'
          - key: invalid
            statusCode: 400
            contentType: application/json
            body: '{"error":"invalid"}'
          - key: error
            statusCode: 500
            contentType: application/json
            body: '{"error":"internal"}'
  jira:projectPage:
    - key: aftercare-release-impact-project-page
      resource: main
      resolver:
        function: aftercare-resolver
      render: native
      title: Aftercare
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/65e458bd-412c-4268-afe9-7a152d74f768
permissions:
  scopes:
    - read:jira-work
    - storage:app
