version: 2
updates:
  - package-ecosystem: npm
    directory: "/aftercare-release-impact"
    schedule:
      interval: weekly
      day: wednesday
      time: "08:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "08:15"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
