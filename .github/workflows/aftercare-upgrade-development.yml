name: Upgrade Aftercare development permissions

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Confirm: deploy and upgrade Aftercare on agkoodaga.atlassian.net with storage:app and GitLab.com backend access."
        required: true
        type: choice
        options:
          - I authorize this development permission upgrade

permissions:
  contents: read

concurrency:
  group: aftercare-jira-development-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade Aftercare on agkoodaga.atlassian.net
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aftercare-release-impact
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aftercare-release-impact/package-lock.json

      - name: Check Forge credentials are configured
        shell: bash
        run: |
          if [[ -z "$FORGE_EMAIL" || -z "$FORGE_API_TOKEN" ]]; then
            echo "::error::Add FORGE_EMAIL and FORGE_API_TOKEN as GitHub Actions secrets before running this workflow."
            exit 1
          fi

      - name: Install locked app dependencies
        run: npm ci

      - name: Install Forge CLI
        run: npm install --global @forge/cli@15.0.0

      - name: Disable Forge CLI usage analytics
        run: forge settings set usage-analytics false

      - name: Validate the app manifest
        run: forge lint

      # This is deliberately manual: the required workflow input authorizes
      # the major version approval and the development-site permission upgrade.
      - name: Deploy the approved major version to development
        run: forge deploy --approve MAJOR_VERSION_RULE --non-interactive --environment development

      - name: Check Runs on Atlassian eligibility
        run: forge eligibility --environment development --non-interactive

      - name: Upgrade the Jira development installation
        run: forge install --upgrade --non-interactive --confirm-scopes --site agkoodaga.atlassian.net --product Jira --environment development
