name: Aftercare validation

on:
  push:
    branches:
      - feat/project-context-dashboard
  pull_request:
    paths:
      - "aftercare-release-impact/**"
      - ".github/workflows/aftercare-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Audit, lint and Forge validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aftercare-release-impact

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aftercare-release-impact/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run ESLint
        run: npm run lint

      - name: Install Forge CLI
        run: npm install --global @forge/cli@15.0.0

      # Forge CLI asks about usage analytics on first run. Set the preference
      # explicitly to false so validation is deterministic in non-TTY CI.
      - name: Disable Forge CLI usage analytics in CI
        run: forge settings set usage-analytics false

      - name: Validate Forge app and manifest
        run: forge lint
